services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./db.env

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./db.env
    environment:
      AI_WORKER_URL: "http://ai-worker:4030"
      # URL of the Telegram MTProto worker (on the dedicated VPS, via its tunnel).
      # Read from the deploy env/.env so the ephemeral tunnel URL isn't baked in;
      # empty -> the jobs Telegram source falls back to the t.me/s scrape.
      TELEGRAM_WORKER_URL: "http://5.175.234.79:4100"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:3000"
    networks:
      - default
      - ai-net

networks:
  ai-net:
    external: true
